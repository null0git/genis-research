experiment_id: "E01-no-torch"
description: "Baseline reproduction: RF, XGBoost ONLY (no MLP) -- for environments where torch cannot be installed or is broken (e.g. persistent Windows DLL issues). Official supported fallback, not a hack -- see README.md Troubleshooting."
research_question: "Reproduction baseline for RQ1/RQ2 (partial -- flow-independent tree models only, MLP excluded)"
data_config: "configs/data.yaml"
models:
  - "configs/models/rf.yaml"
  - "configs/models/xgboost.yaml"
split:
  strategy: "random"
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  n_seeds: 5
  seeds: [42, 43, 44, 45, 46]
label_column: "binary_label"
use_sequences: false
output_prefix: "e01_no_torch"
